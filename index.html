<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jessy ♡</title>
  
  <meta property="og:title" content="Jessy ♡">
  <meta property="og:description" content="welcome to jessy click to watch">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary-pink: #ff85a2;
      --soft-pink: #ffb3c6;
      --bg-pink: #fff0f3;
      --card-bg: rgba(255, 255, 255, 0.95);
      --border-pink: #ffccd5;
      --text-dark: #4a3b3e;
      --text-muted: #8a7377;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      padding: 26px 14px 60px;
      position: relative;
      background: radial-gradient(circle at top, #ffe5ec 0%, #fff0f3 50%, #ffd6e0 100%);
      overflow-x: hidden;
    }

    /* Pop-up หน้าต้อนรับกรอบสีชมพู */
    .enter-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 229, 236, 0.96);
      backdrop-filter: blur(10px);
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .enter-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .enter-box {
      background: #ffffff;
      padding: 28px 24px;
      border-radius: 28px;
      border: 2.5px solid var(--primary-pink);
      box-shadow: 0 12px 35px rgba(255, 133, 162, 0.35);
      text-align: center;
      max-width: 320px;
      width: 85%;
      animation: popIntro 0.35s ease;
    }

    @keyframes popIntro {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .enter-icon {
      width: 65px;
      height: 65px;
      border-radius: 18px;
      object-fit: cover;
      margin-bottom: 12px;
      border: 1.5px solid var(--border-pink);
      animation: gentleBounce 1.5s infinite ease-in-out;
    }

    .enter-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--primary-pink);
      margin-bottom: 6px;
    }

    .enter-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .enter-btn {
      width: 100%;
      background: linear-gradient(135deg, #ffb3c6, var(--primary-pink));
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 6px 16px rgba(255, 133, 162, 0.35);
      cursor: pointer;
    }

    /* ภาพ PNG ลอยไปมา */
    .floating-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .float-item {
      position: absolute;
      bottom: -80px;
      width: 44px;
      height: 44px;
      object-fit: contain;
      pointer-events: none;
      animation: floatUp 12s linear infinite;
      opacity: 0.85;
      filter: drop-shadow(0 4px 8px rgba(255, 133, 162, 0.25));
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
    }

    .wrapper {
      width: 100%;
      max-width: 390px;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ส่วนหัวโปรไฟล์ */
    .header-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border-radius: 30px;
      padding: 12px 12px 22px;
      text-align: center;
      border: 2px solid #ffffff;
      box-shadow: 0 10px 28px rgba(255, 133, 162, 0.2);
    }

    .banner-container {
      width: 100%;
      height: 145px;
      border-radius: 22px;
      overflow: hidden;
      background: #ffe6ec;
      border: 1.5px solid #ffffff;
    }

    .banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-wrap {
      position: relative;
      margin-top: -46px;
      display: inline-block;
      width: 90px;
      height: 90px;
    }

    .profile-img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3.5px solid #ffffff;
      box-shadow: 0 6px 18px rgba(255, 133, 162, 0.28);
      background: #fff;
    }

    .store-title-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }

    .store-name {
      font-size: 21px;
      font-weight: 700;
      color: var(--primary-pink);
      letter-spacing: 0.4px;
    }

    .mini-custom-icon {
      width: 26px;
      height: 26px;
      object-fit: contain;
      animation: gentleBounce 2s infinite ease-in-out;
    }

    @keyframes gentleBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .store-bio {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 8px;
      line-height: 1.6;
      white-space: pre-line;
      padding: 0 12px;
    }

    .music-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      background: #ffffff;
      border: 1.5px solid var(--border-pink);
      color: var(--primary-pink);
      padding: 5px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 179, 198, 0.3);
      transition: all 0.2s ease;
    }

    .music-btn:active {
      transform: scale(0.96);
    }

    /* รายการปุ่มลิงก์ */
    .links-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 22px;
      padding: 15px 18px;
      border: 2px solid #ffffff;
      box-shadow: 0 6px 20px rgba(255, 133, 162, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: var(--text-dark);
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .link-card:active {
      transform: scale(0.97);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .link-tag-icon {
      font-size: 16px;
      color: var(--primary-pink);
    }

    .link-arrow {
      color: var(--primary-pink);
      font-size: 15px;
      font-weight: 700;
    }

    .footer-text {
      text-align: center;
      font-size: 12px;
      color: var(--primary-pink);
      font-weight: 600;
      margin-top: 14px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- หน้า Pop-up ต้อนรับ -->
  <div class="enter-overlay" id="enterOverlay" onclick="enterSiteAndPlay()">
    <div class="enter-box">
      <img src="https://i.ibb.co/XxnSwFT4/line-oa-chat-261013-214319.jpg" class="enter-icon" alt="Welcome Icon">
      <div class="enter-title">Jessy ♡</div>
      <div class="enter-sub">welcome to jessy<br>click to watch</div>
      <button type="button" class="enter-btn">go to website♡</button>
    </div>
  </div>

  <!-- เครื่องเล่นเพลง -->
  <audio id="bgMusic" loop preload="auto" src="https://file.garden/asG8Gt-rqWIpi3II/Playboi%20Carti-%209%20AM%20in%20Calabasas%20remix%20(prod%20by%20Adrian).mp3"></audio>

  <!-- เลเยอร์ภาพลอย -->
  <div class="floating-layer" id="floatContainer"></div>

  <div class="wrapper">
    <!-- Header ส่วนหัวร้าน -->
    <div class="header-card">
      <div class="banner-container">
        <img id="bannerImg" src="https://file.garden/asG8Gt-rqWIpi3II/line_oa_chat_261013_214709.jpeg" alt="Banner" class="banner-img">
      </div>

      <div class="profile-wrap">
        <img id="profileImg" src="https://file.garden/asG8Gt-rqWIpi3II/line_oa_chat_261013_214850.jpeg" alt="Profile" class="profile-img">
      </div>

      <div class="store-title-wrap">
        <h1 class="store-name" id="storeNameText">Jessy ♡</h1>
        <img id="miniMelodyIcon" src="https://i.ibb.co/fzGs2TvM/IMG-3954.png" alt="Icon" class="mini-custom-icon">
      </div>

      <div class="store-bio" id="storeBioText">เนื่องจากเฟสเค้าบินรบกวนลูกค้าใช้บริการเสร็จแล้วพลัสให้ร้านหน่อยนะคะ ไม่สะดวกฝากพลัสได้ค่ะ</div>

      <button type="button" class="music-btn" id="musicToggleBtn" onclick="toggleMusic()">
        <span id="musicIcon">▶</span> <span id="musicText">play music !</span>
      </button>
    </div>

    <!-- รายการปุ่มลิงก์ 3 ปุ่ม -->
    <div class="links-wrapper" id="linksList">
      <a href="https://line.me/R/ti/p/@174vhpdt" target="_blank" class="link-card" id="link1">
        <div class="link-left">
          <span class="link-tag-icon">💬</span>
          <span id="title1">line</span>
        </div>
        <span class="link-arrow">➔</span>
      </a>

      <a href="https://bit.ly/4rXRgvU" target="_blank" class="link-card" id="link2">
        <div class="link-left">
          <span class="link-tag-icon">⭐</span>
          <span id="title2">credit</span>
        </div>
        <span class="link-arrow">➔</span>
      </a>

      <a href="https://bit.ly/4hJvBEp" target="_blank" class="link-card" id="link3">
        <div class="link-left">
          <span class="link-tag-icon">📁</span>
          <span id="title3">example</span>
        </div>
        <span class="link-arrow">➔</span>
      </a>
    </div>

    <div class="footer-text">thank you ♡</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
      authDomain: "benefitie.firebaseapp.com",
      projectId: "benefitie",
      storageBucket: "benefitie.firebasestorage.app",
      messagingSenderId: "270365672215",
      appId: "1:270365672215:web:230d1491091e26ce83ed52"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const music = document.getElementById('bgMusic');
    const musicIcon = document.getElementById('musicIcon');
    const musicText = document.getElementById('musicText');

    // ดึงข้อมูล Realtime จากหลังบ้าน
    db.collection("jessy_site").doc("config").onSnapshot(doc => {
      if (doc.exists) {
        const d = doc.data();
        if (d.storeName) document.getElementById("storeNameText").textContent = d.storeName;
        if (d.storeBio) document.getElementById("storeBioText").textContent = d.storeBio;
        if (d.bannerImg) document.getElementById("bannerImg").src = d.bannerImg;
        if (d.profileImg) document.getElementById("profileImg").src = d.profileImg;

        if (d.link1_title) document.getElementById("title1").textContent = d.link1_title;
        if (d.link1_url) document.getElementById("link1").href = d.link1_url;

        if (d.link2_title) document.getElementById("title2").textContent = d.link2_title;
        if (d.link2_url) document.getElementById("link2").href = d.link2_url;

        if (d.link3_title) document.getElementById("title3").textContent = d.link3_title;
        if (d.link3_url) document.getElementById("link3").href = d.link3_url;

        if (d.musicUrl && !music.src.endsWith(d.musicUrl)) {
          music.src = d.musicUrl;
          music.play().catch(() => {});
        }
      }
    });

    function updateAudioStatus(isPlaying) {
      if (isPlaying) {
        musicIcon.textContent = "❚❚";
        musicText.textContent = "pause music";
      } else {
        musicIcon.textContent = "▶";
        musicText.textContent = "play music !";
      }
    }

    function enterSiteAndPlay() {
      document.getElementById('enterOverlay').classList.add('hidden');
      music.play().then(() => {
        updateAudioStatus(true);
      }).catch(err => {
        console.log("Play error:", err);
      });
    }

    function toggleMusic() {
      if (music.paused) {
        music.play().then(() => updateAudioStatus(true)).catch(() => {});
      } else {
        music.pause();
        updateAudioStatus(false);
      }
    }

    // ภาพ PNG ลอยไปมา
    const floatBox = document.getElementById("floatContainer");
    const floatingImgSrc = "https://i.ibb.co/twf7DBcd/IMG-3955.png";

    function createFloatingItem() {
      const el = document.createElement("img");
      el.src = floatingImgSrc;
      el.className = "float-item";
      el.style.left = (Math.random() * 90) + "vw";
      el.style.animationDuration = (8 + Math.random() * 6) + "s";
      el.style.width = (38 + Math.random() * 18) + "px";
      floatBox.appendChild(el);
      setTimeout(() => { el.remove(); }, 14000);
    }
    setInterval(createFloatingItem, 1600);
  </script>
</body>
</html>
