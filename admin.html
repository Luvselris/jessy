<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Dashboard ♡ Jessy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --pastel-pink: #f472b6;
      --pastel-blue: #38bdf8;
      --bg-pastel: #f0f9ff;
      --card-bg: rgba(255, 255, 255, 0.96);
      --text: #3b354d;
      --border-soft: #e0e7ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', 'Mitr', sans-serif; }
    body { 
      background: radial-gradient(circle at top, #e0f2fe 0%, #fdf2f8 55%, #ede9fe 100%); 
      color: var(--text); min-height: 100vh; padding: 20px 14px 60px; display: flex; justify-content: center; 
    }
    .container { width: 100%; max-width: 440px; }
    
    .card {
      background: var(--card-bg); border-radius: 24px; padding: 22px 20px;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.15); border: 1.5px solid #fff; margin-bottom: 16px;
    }
    .title { font-size: 19px; font-weight: 700; color: var(--pastel-pink); text-align: center; margin-bottom: 16px; }
    .field-group { margin-bottom: 14px; }
    .field-label { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; display: block; }
    .input-box, .textarea-box {
      width: 100%; padding: 11px 14px; border-radius: 14px; border: 1.5px solid var(--border-soft);
      outline: none; font-size: 13.5px; background: #fff; color: var(--text); transition: all 0.2s;
    }
    .input-box:focus, .textarea-box:focus { border-color: var(--pastel-blue); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
    .textarea-box { resize: vertical; min-height: 75px; line-height: 1.5; }
    
    .image-picker-box {
      display: flex; flex-direction: column; gap: 8px; margin-top: 4px;
    }
    .file-input-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 14px; background: #fdf2f8; border: 1.5px dashed var(--pastel-pink);
      border-radius: 14px; color: var(--pastel-pink); font-size: 12.5px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .file-input-btn:active { background: #fce7f3; }
    .img-preview {
      width: 100%; height: 110px; border-radius: 14px; object-fit: cover;
      border: 1.5px solid var(--border-soft); margin-top: 4px; background: #fafafa;
    }
    .img-preview-circle {
      width: 75px; height: 75px; border-radius: 50%; object-fit: cover;
      border: 2px solid var(--border-soft); margin-top: 4px; align-self: center;
    }

    .btn {
      width: 100%; padding: 12px; border-radius: 18px; border: none; font-size: 14.5px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; background: linear-gradient(135deg, var(--pastel-pink), var(--pastel-blue)); color: #fff;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3); margin-top: 6px;
    }
    .btn:active { transform: scale(0.98); }
    .btn-secondary { background: #fff; color: var(--pastel-pink); border: 1.5px solid var(--border-soft); box-shadow: none; margin-top: 10px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <!-- ล็อกอิน -->
  <div class="card" id="loginBox">
    <div class="title">🔐 เข้าสู่ระบบแอดมิน ♡ Jessy</div>
    <div class="field-group">
      <label class="field-label">อีเมลแอดมิน</label>
      <input type="email" id="loginEmail" class="input-box" placeholder="somethingrenji@gmail.com">
    </div>
    <div class="field-group">
      <label class="field-label">รหัสผ่าน</label>
      <input type="password" id="loginPassword" class="input-box" placeholder="กรอกรหัสผ่าน">
    </div>
    <button type="button" class="btn" onclick="handleLogin()">เข้าสู่ระบบ ♡</button>
  </div>

  <!-- แผงแก้ไขข้อมูล -->
  <div id="dashboardBox" class="hidden">
    
    <!-- 1. ข้อมูลหน้าร้าน & รูปภาพ -->
    <div class="card">
      <div class="title">🌸 ข้อมูลหน้าร้าน & รูปภาพ</div>
      
      <div class="field-group">
        <label class="field-label">ชื่อร้าน</label>
        <input type="text" id="storeName" class="input-box">
      </div>

      <div class="field-group">
        <label class="field-label">คำอธิบายใต้ชื่อ (Bio)</label>
        <textarea id="storeBio" class="textarea-box"></textarea>
      </div>

      <!-- แบนเนอร์ -->
      <div class="field-group">
        <label class="field-label">🖼️ รูปแบนเนอร์</label>
        <div class="image-picker-box">
          <label class="file-input-btn">
            📁 เลือกรูปจากโทรศัพท์
            <input type="file" accept="image/*" style="display: none;" onchange="handleFileUpload(event, 'banner')">
          </label>
          <input type="text" id="bannerImg" class="input-box" placeholder="หรือวาง URL รูปภาพ" oninput="handleUrlInput('banner')">
          <img id="bannerPreview" class="img-preview" src="">
        </div>
      </div>

      <!-- โปรไฟล์ -->
      <div class="field-group">
        <label class="field-label">👤 รูปโปรไฟล์</label>
        <div class="image-picker-box">
          <label class="file-input-btn">
            📁 เลือกรูปจากโทรศัพท์
            <input type="file" accept="image/*" style="display: none;" onchange="handleFileUpload(event, 'profile')">
          </label>
          <input type="text" id="profileImg" class="input-box" placeholder="หรือวาง URL รูปภาพ" oninput="handleUrlInput('profile')">
          <img id="profilePreview" class="img-preview-circle" src="">
        </div>
      </div>
    </div>

    <!-- 2. จัดการปุ่มลิงก์ทั้ง 3 ปุ่ม -->
    <div class="card">
      <div class="title">🔗 แก้ไขปุ่มลิงก์</div>
      
      <div style="border-bottom: 1.5px dashed var(--border-soft); padding-bottom: 12px; margin-bottom: 12px;">
        <div class="field-group">
          <label class="field-label">ชื่อกล่อง 1</label>
          <input type="text" id="link1_title" class="input-box">
        </div>
        <div class="field-group">
          <label class="field-label">URL ลิงก์ 1</label>
          <input type="text" id="link1_url" class="input-box">
        </div>
      </div>

      <div style="border-bottom: 1.5px dashed var(--border-soft); padding-bottom: 12px; margin-bottom: 12px;">
        <div class="field-group">
          <label class="field-label">ชื่อกล่อง 2</label>
          <input type="text" id="link2_title" class="input-box">
        </div>
        <div class="field-group">
          <label class="field-label">URL ลิงก์ 2</label>
          <input type="text" id="link2_url" class="input-box">
        </div>
      </div>

      <div>
        <div class="field-group">
          <label class="field-label">ชื่อกล่อง 3</label>
          <input type="text" id="link3_title" class="input-box">
        </div>
        <div class="field-group">
          <label class="field-label">URL ลิงก์ 3</label>
          <input type="text" id="link3_url" class="input-box">
        </div>
      </div>
    </div>

    <!-- 3. เพลงพื้นหลัง -->
    <div class="card">
      <div class="title">🎵 เพลงพื้นหลัง (.mp3)</div>
      <div class="field-group">
        <label class="field-label">URL ไฟล์เสียง</label>
        <input type="text" id="musicUrl" class="input-box">
      </div>
    </div>

    <!-- 4. เปลี่ยนรหัสผ่าน -->
    <div class="card">
      <div class="title">🔑 เปลี่ยนรหัสผ่านแอดมิน</div>
      <div class="field-group">
        <label class="field-label">รหัสผ่านใหม่</label>
        <input type="password" id="newAdminPassword" class="input-box" placeholder="ปล่อยว่างหากไม่ต้องการเปลี่ยน">
      </div>
    </div>

    <button type="button" class="btn" id="saveBtn" onclick="saveAllSettings()">☁️ บันทึกขึ้นระบบ (หน้าเว็บเปลี่ยนทันที) ♡</button>
    <button type="button" class="btn btn-secondary" onclick="logout()">ออกจากระบบ</button>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
    authDomain: "benefitie.firebaseapp.com",
    projectId: "benefitie",
    storageBucket: "benefitie.firebasestorage.app",
    messagingSenderId: "270365672215",
    appId: "1:270365672215:web:230d1491091e26ce83ed52"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let currentAdminEmail = "somethingrenji@gmail.com";
  let currentAdminPass = "rakpmuaywonwoo6767_";

  db.collection("jessy_site").doc("config").onSnapshot(doc => {
    if (doc.exists) {
      const d = doc.data();
      if (d.adminEmail) currentAdminEmail = d.adminEmail;
      if (d.adminPass) currentAdminPass = d.adminPass;
    }
  });

  function handleLogin() {
    const email = document.getElementById("loginEmail").value.trim();
    const pass = document.getElementById("loginPassword").value.trim();

    if (email === currentAdminEmail && pass === currentAdminPass) {
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("dashboardBox").classList.remove("hidden");
      loadCurrentConfig();
    } else {
      alert("อีเมลหรือรหัสผ่านไม่ถูกต้องค่ะ!");
    }
  }

  function handleUrlInput(type) {
    const input = document.getElementById(type === 'banner' ? 'bannerImg' : 'profileImg');
    const preview = document.getElementById(type === 'banner' ? 'bannerPreview' : 'profilePreview');
    preview.src = input.value.trim();
  }

  function handleFileUpload(event, type) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        const maxDimension = type === 'banner' ? 800 : 400;
        let width = img.width;
        let height = img.height;

        if (width > maxDimension || height > maxDimension) {
          if (width > height) {
            height *= maxDimension / width;
            width = maxDimension;
          } else {
            width *= maxDimension / height;
            height = maxDimension;
          }
        }

        canvas.width = width;
        canvas.height = height;
        ctx.drawImage(img, 0, 0, width, height);

        const dataUrl = canvas.toDataURL("image/jpeg", 0.85);

        if (type === 'banner') {
          document.getElementById('bannerImg').value = dataUrl;
          document.getElementById('bannerPreview').src = dataUrl;
        } else {
          document.getElementById('profileImg').value = dataUrl;
          document.getElementById('profilePreview').src = dataUrl;
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function loadCurrentConfig() {
    db.collection("jessy_site").doc("config").get().then(doc => {
      const d = doc.exists ? doc.data() : {};
      document.getElementById("storeName").value = d.storeName || "Jessy ♡";
      document.getElementById("storeBio").value = d.storeBio || `เนื่องจากเฟสเค้าบินรบกวนลูกค้าใช้บริการเสร็จแล้วพลัสให้ร้านหน่อยนะคะ ไม่สะดวกฝากพลัสได้ค่ะ`;
      
      const bannerSrc = d.bannerImg || "https://file.garden/asG8Gt-rqWIpi3II/line_oa_chat_261013_214709.jpeg";
      document.getElementById("bannerImg").value = bannerSrc;
      document.getElementById("bannerPreview").src = bannerSrc;

      const profileSrc = d.profileImg || "https://file.garden/asG8Gt-rqWIpi3II/line_oa_chat_261013_214850.jpeg";
      document.getElementById("profileImg").value = profileSrc;
      document.getElementById("profilePreview").src = profileSrc;

      document.getElementById("link1_title").value = d.link1_title || "line";
      document.getElementById("link1_url").value = d.link1_url || "https://line.me/R/ti/p/@174vhpdt";

      document.getElementById("link2_title").value = d.link2_title || "credit";
      document.getElementById("link2_url").value = d.link2_url || "https://bit.ly/4rXRgvU";

      document.getElementById("link3_title").value = d.link3_title || "example";
      document.getElementById("link3_url").value = d.link3_url || "https://bit.ly/4hJvBEp";

      document.getElementById("musicUrl").value = d.musicUrl || "https://file.garden/asG8Gt-rqWIpi3II/Playboi%20Carti-%209%20AM%20in%20Calabasas%20remix%20(prod%20by%20Adrian).mp3";
    });
  }

  async function saveAllSettings() {
    const saveBtn = document.getElementById("saveBtn");
    saveBtn.disabled = true;
    saveBtn.textContent = "กำลังบันทึก...";

    const payload = {
      storeName: document.getElementById("storeName").value.trim(),
      storeBio: document.getElementById("storeBio").value.trim(),
      bannerImg: document.getElementById("bannerImg").value.trim(),
      profileImg: document.getElementById("profileImg").value.trim(),

      link1_title: document.getElementById("link1_title").value.trim(),
      link1_url: document.getElementById("link1_url").value.trim(),

      link2_title: document.getElementById("link2_title").value.trim(),
      link2_url: document.getElementById("link2_url").value.trim(),

      link3_title: document.getElementById("link3_title").value.trim(),
      link3_url: document.getElementById("link3_url").value.trim(),

      musicUrl: document.getElementById("musicUrl").value.trim(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    const newPass = document.getElementById("newAdminPassword").value.trim();
    if (newPass) {
      payload.adminPass = newPass;
      currentAdminPass = newPass;
    }

    try {
      await db.collection("jessy_site").doc("config").set(payload, { merge: true });
      alert("บันทึกข้อมูลเรียบร้อยแล้วค่ะ! หน้าเว็บจะเปลี่ยนทันที");
      document.getElementById("newAdminPassword").value = "";
    } catch (err) {
      alert("เกิดข้อผิดพลาด: " + err.message);
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = "☁️ บันทึกขึ้นระบบ (หน้าเว็บเปลี่ยนทันที) ♡";
    }
  }

  function logout() {
    document.getElementById("dashboardBox").classList.add("hidden");
    document.getElementById("loginBox").classList.remove("hidden");
    document.getElementById("loginPassword").value = "";
  }
</script>
</body>
</html>
